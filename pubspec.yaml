name: omni_utility
description: All-in-One 100-Feature Utility Android App.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  shared_preferences: 2.3.2
  path_provider: 2.1.4
  file_picker: 8.1.2
  image_picker: 1.1.2
  share_plus: 10.0.2
  sensors_plus: 6.0.1
  pdf: 3.11.1
  printing: 5.13.3
  image: 4.2.0
  archive: 3.6.1
  crypto: 3.0.5
  http: 1.2.2
  qr_flutter: 4.1.0
  math_expressions: 2.6.0

flutter:
  uses-material-design: true
